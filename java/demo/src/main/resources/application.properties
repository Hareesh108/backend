spring.application.name=demo

# H2 in-memory database for local/demo startup
# H2 is an embedded database that runs inside the app process.
# It does not require a separate database server and is ideal for
# quick development, demos, or running tests locally.
# Data is stored in memory only and will be lost when the app stops.
# Use this when you want the app to start without installing Postgres.
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate & JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# PostgreSQL Configuration (uncomment for production/local postgres)
# If you want to connect to a real PostgreSQL server instead of H2,
# uncomment the lines below and configure the URL, username, and password.
# spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/nextdb
# spring.datasource.username=postgres
# spring.datasource.password=root
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect